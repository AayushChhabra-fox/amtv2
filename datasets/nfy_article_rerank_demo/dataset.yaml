# Executable NFY article rerank spec. Phase 0 measurements that fixed these
# choices live in docs/phase0_profile.json: impression dedupe is
# latest_impression_rn = 1, profiles join on user_profile_key +
# profile_content_hash, and the label window is 24h because dwell is
# time-on-page. news_interactions.event_created places the grade inside
# that window. context_embedding_3072 is the article vector on
# product_api_prod.news_for_you.news_candidates_feature; it is not a
# feature here because the column is a current snapshot.
# Shadow run: six hours (12:00-18:00 UTC, the daily peak) inside the NFY train
# range, so a demo never touches the NFY search or holdout dates. The 24h
# label window outlasts the zero-hour gaps, so later splits are not
# label-independent of train; scores are for comparing candidates only.
# SQL is shared with nfy_article_rerank.
name: nfy_article_rerank_demo
task_type: ranking
entity_type: article
primary_metric: ndcg@10_graded

output:
  catalog: product_api_dev
  schema: amt

sources:
  requests:
    table: pnr_prod.silver.nfy_reco_requests
    date_col: event_date
    partition_filter: "{date_col} BETWEEN DATE '{start}' AND DATE '{end}'"
  candidates:
    table: pnr_prod.silver.nfy_reco_candidates
    date_col: event_date
    partition_filter: "{date_col} BETWEEN DATE '{start}' AND DATE '{end}'"
  impressions:
    table: pnr_prod.silver.news_impressions
    date_col: make_date(year, month, day)
    # Unpartitioned and unclustered (12 TB). The padded timestamp bound lets Delta skip
    # files; make_date alone cannot, so every scan read the whole table.
    partition_filter: >-
      timestamp >= TIMESTAMP '{start} 00:00:00' - INTERVAL 1 DAY
      AND timestamp < TIMESTAMP '{end} 00:00:00' + INTERVAL 2 DAYS
      AND {date_col} BETWEEN DATE '{start}' AND DATE '{end}'
  interactions:
    table: pnr_prod.silver.news_interactions
    date_col: event_date
    partition_filter: "{date_col} BETWEEN DATE '{start}' AND DATE '{end}'"
  profiles:
    table: pnr_prod.silver.nfy_user_profile_versions
    unpartitioned: true
  articles:
    table: pnr_prod.bronze.news_article_feature
    unpartitioned: true
  article_features:
    table: product_api_prod.news_for_you.news_candidates_feature
    unpartitioned: true

queries: queries.sql
candidates: candidates.sql
labels:
  sql: labels.sql
  label_window: 24h
  aux_labels: [click]

feature_groups:
  profile:
    sql: features/profile.sql
    keys: [query_id]
    available_at: profile_version_ts
  prod_signals:
    sql: features/prod_signals.sql
    keys: [query_id, item_id]
    available_at: query_ts
  article:
    sql: features/article.sql
    keys: [item_id]
    available_at: published_ts
  context:
    sql: features/context.sql
    keys: [query_id]
    available_at: query_ts
  popularity:
    sql: features/popularity.sql
    keys: [query_id, item_id]
    available_at: popularity_window_end
    lookback_days: 7

reference_scores:
  production: total_score
  recency: "-item_age_seconds"

filters:
  include_query_if: "max(label) >= 1"

forbidden_columns:
  - item_index
  - display_position
  - latest_profile_*

candidate_bounds:
  min: 1
  max: 100

split:
  time_col: query_ts
  gap_days: 0
  train: 2026-10-07T12:00..2026-10-07T15:00
  search_val: 2026-10-07T15:00..2026-10-07T16:00
  select_holdout: 2026-10-07T16:00..2026-10-07T17:00
  final_holdout: 2026-10-07T17:00..2026-10-07T18:00

sampling:
  seed: 0
  smoke:
    train_queries: 500
    eval_queries: 200
  rungs:
    R1:
      train_fraction: 0.10
      eval_queries: 1000
    R2:
      train_fraction: 0.40
      eval_queries: 2000
    R3:
      train_fraction: 1.00
      eval_queries: all

checks:
  - name: prod_ndcg_reproduces
    score: ref.production
    metric: ndcg@10_click
    split: search_val
    expected: checks/prod_ndcg.sql
    tol: 0.005
  - name: queries_per_day
    min: 100
  # 15:00-18:00 UTC averages about 18.8 candidates per usable query.
  - name: candidates_per_query_mean
    between: [15, 40]
