# Same tables as nfy_article_rerank, filtered to entity_type clip.
# The builder and harness do not special-case this surface.
name: nfy_clip_rerank
task_type: ranking
entity_type: clip
primary_metric: ndcg@10_graded

output:
  catalog: product_api_dev
  schema: amt

sources:
  requests:
    table: pnr_prod.silver.nfy_reco_requests
    date_col: event_date
    partition_filter: "{date_col} BETWEEN DATE '{start}' AND DATE '{end}'"
  candidates:
    table: pnr_prod.silver.nfy_reco_candidates
    date_col: event_date
    partition_filter: "{date_col} BETWEEN DATE '{start}' AND DATE '{end}'"
  impressions:
    table: pnr_prod.silver.news_impressions
    date_col: make_date(year, month, day)
    partition_filter: "{date_col} BETWEEN DATE '{start}' AND DATE '{end}'"
  interactions:
    table: pnr_prod.silver.news_interactions
    date_col: event_date
    partition_filter: "{date_col} BETWEEN DATE '{start}' AND DATE '{end}'"
  profiles:
    table: pnr_prod.silver.nfy_user_profile_versions
    unpartitioned: true
  articles:
    table: pnr_prod.bronze.news_article_feature
    unpartitioned: true
  article_features:
    table: product_api_prod.news_for_you.news_candidates_feature
    unpartitioned: true

queries: queries.sql
candidates: candidates.sql
labels:
  sql: labels.sql
  label_window: 24h
  aux_labels: [click]

feature_groups:
  profile:
    sql: features/profile.sql
    keys: [query_id]
    available_at: profile_version_ts
  prod_signals:
    sql: features/prod_signals.sql
    keys: [query_id, item_id]
    available_at: query_ts
  article:
    sql: features/article.sql
    keys: [item_id]
    available_at: published_ts
  context:
    sql: features/context.sql
    keys: [query_id]
    available_at: query_ts
  popularity:
    sql: features/popularity.sql
    keys: [query_id, item_id]
    available_at: popularity_window_end
    lookback_days: 7

reference_scores:
  production: total_score
  recency: "-item_age_seconds"

filters:
  include_query_if: "max(label) >= 1"

forbidden_columns:
  - item_index
  - display_position
  - latest_profile_*

candidate_bounds:
  min: 1
  max: 100

split:
  time_col: query_ts
  gap_days: 1
  train: 2026-09-14..2026-10-18
  search_val: 2026-10-20..2026-10-26
  select_holdout: 2026-10-28..2026-11-02
  final_holdout: 2026-11-04..2026-11-10

sampling:
  seed: 0
  smoke:
    train_queries: 2000
    eval_queries: 1000
  rungs:
    R1:
      train_fraction: 0.10
      eval_queries: 20000
    R2:
      train_fraction: 0.40
      eval_queries: 60000
    R3:
      train_fraction: 1.00
      eval_queries: all

checks:
  - name: prod_ndcg_reproduces
    score: ref.production
    metric: ndcg@10_click
    split: search_val
    expected: checks/prod_ndcg.sql
    tol: 0.005
  - name: queries_per_day
    min: 1
  - name: candidates_per_query_mean
    between: [1, 100]
