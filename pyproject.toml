[project]
name = "amt"
version = "0.0.1"
description = "Automated Model Trainer control loop"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.3",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.scripts]
amt = "amt.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amt", "harness"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/nfy_article_rerank" = "datasets/nfy_article_rerank"
"datasets/nfy_clip_rerank" = "datasets/nfy_clip_rerank"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
