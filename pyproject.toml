[project]
name = "amt"
version = "0.0.1"
description = "Automated Model Trainer control loop"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.scripts]
amt = "amt.cli:main"

[dependency-groups]
dev = ["mlflow>=2.16", "pytest>=8.0", "ruff>=0.6"]
models = [
    "catboost>=1.2.10",
    "torch>=2.15.0",
    "xgboost>=3.2.0",
]

[tool.uv]
# Preflight imports each candidate locally, so the families' libraries must be here too.
default-groups = ["dev", "models"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amt", "harness"]

[tool.hatch.build.targets.wheel.force-include]
"datasets" = "datasets"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["databricks: live Databricks workspace test (set AMT_LIVE_DATABRICKS=1)"]
