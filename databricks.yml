bundle:
  name: amt

include:
  - resources/*.yml

variables:
  experiment_name:
    description: MLflow experiment used by every AMT training run.
    default: /Shared/amt/nfy_article_rerank
  catalog:
    default: product_api_dev
  schema:
    default: amt
  cpu_node_type_id:
    description: CPU node pinned for dataset, train, confirm, and latency runs.
    default: m5d.xlarge
  spark_version:
    default: 15.4.x-scala2.12
  artifact_volume:
    default: /Volumes/product_api_dev/amt/amt_artifacts

artifacts:
  amt_wheel:
    type: whl
    path: .
    build: uv build --wheel

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fox-product-eng-dev-nation.cloud.databricks.com
